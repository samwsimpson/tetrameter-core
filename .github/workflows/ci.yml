name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the SDK resolves the engine through its published entry
      # points, so its types do not exist until the engine has been compiled.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # The library's whole value is that its numbers are reproducible. A demo
      # that throws is a broken methodology, not a broken example.
      - name: Smoke demo
        working-directory: packages/core
        run: npx vite-node test/smoke.demo.ts
