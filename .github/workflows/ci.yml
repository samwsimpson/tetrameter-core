name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version pin here on purpose: package.json declares packageManager,
      # and specifying both makes the action fail with "multiple versions".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the SDK resolves the engine through its published entry
      # points, so its types do not exist until the engine has been compiled.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

      # The Python collector runs in the same CI as the TypeScript one, because a
      # sibling package that is only tested when somebody remembers is a sibling
      # package that drifts. No dependencies to install: it is stdlib only.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python collector
        working-directory: packages/sdk-python
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q

      # The library's whole value is that its numbers are reproducible. A demo
      # that throws is a broken methodology, not a broken example.
      - name: Smoke demo
        working-directory: packages/core
        run: npx vite-node test/smoke.demo.ts
